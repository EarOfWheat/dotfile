# Profile Enhancement Merge Template for Clash Verge

pg: &pg
  type: select
  proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT, "🇯🇵 日本节点", "🇭🇰 香港节点", "🇹🇼 台湾节点", "🇺🇸 美国节点"]

pg_t: &pg_t
  interval: 300
  tolerance: 800

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    exclude-filter: "(?i)(过期|剩余|流量|套餐|订阅)"
    include-all: true
  - name: "⚡ 自动选择"
    type: url-test
    <<: *pg_t
    exclude-filter: "(?i)(俄|过期|剩余|流量|套餐|订阅)"
    include-all: true
  - name: "🤖 AI 服务"
    <<: *pg
  - name: "📲 电报消息"
    <<: *pg
  - name: "🌍 非中国"
    <<: *pg
  - name: "🐟 漏网之鱼"
    <<: *pg

  - name: 🇭🇰 香港节点
    type: fallback
    <<: *pg_t
    filter: "(?i)港|hk|hongkong"
    include-all: true
  - name: 🇹🇼 台湾节点
    type: fallback
    <<: *pg_t
    filter: "(?i)台|tw|taiwan"
    include-all: true
  - name: 🇯🇵 日本节点
    type: fallback
    <<: *pg_t
    filter: "(?i)日|jp|japan"
    include-all: true
  - name: 🇺🇸 美国节点
    type: fallback
    <<: *pg_t
    filter: "(?i)美|us|unitedstates"
    include-all: true


rp_dom: &rp_dom
  type: http
  behavior: domain
  interval: 86400
  format: mrs

rp_ip: &rp_ip
  type: http
  behavior: ipcidr
  interval: 86400
  format: mrs

