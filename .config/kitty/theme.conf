# 前景与背景
foreground #abb2bf
background #282c34

# 选区颜色
selection_foreground #282c34
selection_background #61afef

# 标准 16 色
# 黑色
color0  #282c34
color8  #5c6370
# 红色
color1  #e06c75
color9  #e06c75
# 绿色
color2  #98c379
color10 #98c379
# 黄色
color3  #e5c07b
color11 #e5c07b
# 蓝色
color4  #61afef
color12 #61afef
# 品红
color5  #c678dd
color13 #c678dd
# 青色
color6  #56b6c2
color14 #56b6c2
# 白色
color7  #abb2bf
color15 #ffffff

# 背景透明度（需要合成器支持）
background_opacity 0.9
dynamic_background_opacity yes

# 光标形状：block（方块）| beam（竖线）| underline（下划线）
cursor_shape block

# 光标闪烁间隔（秒），设为 0 禁用闪烁
cursor_blink_interval 0.5 ease-in-out

# 光标颜色（none 表示跟随文本前景色）
cursor none

# URL 下划线样式
url_style straight

# 链接颜色
url_color #61afef

# 支持的布局：fat, grid, horizontal, splits, stack, tall, vertical
enabled_layouts splits, stack, tall, fat

# 窗口内边距（pt）
window_padding_width 8 8 0 8

# 窗口边框宽度
window_border_width 1pt

# 非活动窗口文字透明度（1.0 为不透明）
inactive_text_alpha 0.7

